<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Sign-In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 24%), linear-gradient(145deg, #020617 0%, #07111f 100%); color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .card { width: min(520px, calc(100% - 32px)); padding: 32px; border-radius: 32px; background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.12); box-shadow: 0 30px 70px rgba(0,0,0,0.4); }
    h1 { margin: 0 0 18px; font-size: clamp(2rem, 2.6vw, 2.8rem); }
    p { margin: 0 0 24px; color: #94a3b8; line-height: 1.8; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 0.95rem 1.6rem; border: none; cursor: pointer; text-decoration: none; color: #020617; background: linear-gradient(135deg, #22d3ee, #818cf8); transition: transform 0.2s ease; }
    .btn:hover { transform: translateY(-1px); }
    .link { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Google sign-in is not available yet.</h1>
    <p>TrendTracker currently supports navigation to the dashboard, but full Google OAuth is not implemented in this version. You can still continue to the dashboard or return to the homepage.</p>
    <a href="dashboard.html" class="btn">Continue to Dashboard</a>
    <a href="index.html" class="link">Back to homepage</a>
  </div>
</body>
</html>
